services:
  postgres:
    image: postgres:17-alpine
    container_name: moleculejury-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moleculejury}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: ${POSTGRES_DB:-moleculejury}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - moleculejury-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  moleculejury-data:
